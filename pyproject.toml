[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fruit-ripeness-study"
version = "0.2.0"
description = "Mode A multi-fruit image-processing comparison: baseline training"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "Pillow==12.3.0", "scikit-learn==1.8.0", "joblib==1.5.3"]

[project.scripts]
fruit-audit = "fruitripeness.audit:main"
fruit-baseline = "fruitripeness.baseline:main"

[tool.setuptools.packages.find]
where = ["src"]
